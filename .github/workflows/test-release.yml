name: Test and release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
          python scripts/regex-builder.py --pattern "qwen|gemma" --sample "qwen gemma"
      - name: Build installer bundle
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'open-model-weights-api'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item app,docs,install.ps1,requirements.txt,README.md,LICENSE -Destination $stage -Recurse
          Compress-Archive -Path "$stage\*" -DestinationPath open-model-weights-api-windows.zip
      - name: Publish unique release
        shell: pwsh
        run: |
          $tag = "build-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          gh release create $tag open-model-weights-api-windows.zip `
            --title "Build $env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT" `
            --notes "Verified API installer bundle from commit $env:GITHUB_SHA."
